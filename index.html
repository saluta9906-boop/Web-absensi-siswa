<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Absensi Siswa</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app"><header><h1>📚 Absensi Siswa</h1><p>Catat kehadiran dengan mudah</p></header><section class="card"><div class="grid"><label>Tanggal<input id="date" type="date"></label><label>Kelas<input id="className" placeholder="Contoh: X IPA 1"></label></div><label>Nama Siswa<input id="student" placeholder="Masukkan nama siswa"></label><label>Status<select id="status"><option>Hadir</option><option>Izin</option><option>Sakit</option><option>Alpa</option></select></label><button id="add">＋ Tambah Absensi</button></section><section class="card"><div class="toolbar"><h2>Daftar Absensi</h2><button class="secondary" id="clear">Hapus Semua</button></div><div id="summary" class="summary"></div><div class="tablewrap"><table><thead><tr><th>No</th><th>Nama</th><th>Kelas</th><th>Tanggal</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="rows"></tbody></table></div><button id="export">⬇️ Export CSV</button></section></main><script src="script.js"></script></body></html>
