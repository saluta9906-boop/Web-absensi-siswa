<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Data Sekolah — SIAS</title><link rel="stylesheet" href="css/style.css"><style>.school-form{max-width:760px;margin:auto}.school-form .field{display:block;margin-bottom:18px}.school-form .field>span{display:block;font-weight:700;margin-bottom:7px}.school-form input,.school-form textarea{display:block;width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #d5dbe3;border-radius:10px;font:inherit;background:#fff}.school-form textarea{min-height:96px;resize:vertical}.school-form .hint{display:block;margin-top:6px;font-size:.85rem;opacity:.7}.school-form .save-row{margin-top:8px}.school-form button{width:100%}</style></head><body><nav class="navbar"><div class="brand">📚 SIAS</div><button id="menuBtn" class="menu-btn">☰</button><div id="navlinks" class="navlinks"><a class="nav-item" href="dashboard-guru.html">🏠 Dashboard</a><a class="nav-item" href="rekap-harian.html">📅 Rekap Harian</a><a class="nav-item" href="rekap-bulanan.html">🗓️ Rekap Bulanan</a><a class="nav-item active" href="pengaturan-sekolah.html">🏫 Data Sekolah</a><a class="nav-item" href="pengaturan-guru.html">👨‍🏫 Data Guru</a></div><div class="user-area"><span>👨‍🏫 Guru</span><button id="logoutBtn" class="logout">Keluar</button></div></nav><main class="app"><div class="page-title"><div><h1>🏫 Data Sekolah</h1><p>Lengkapi data sekolah untuk digunakan pada kop laporan.</p></div></div><section class="card school-form"><label class="field"><span>Nama Sekolah</span><input id="schoolName" type="text" autocomplete="organization" placeholder="Masukkan nama sekolah"></label><label class="field"><span>Instansi / Dinas</span><input id="department" type="text" placeholder="Masukkan nama instansi / dinas"></label><label class="field"><span>Alamat Sekolah</span><textarea id="address" autocomplete="street-address" placeholder="Masukkan alamat lengkap sekolah"></textarea><small class="hint">Contoh: Jl. Pendidikan No. 1, Kecamatan ..., Kabupaten Maluku Tengah, Provinsi Maluku.</small></label><div class="save-row"><button id="save" type="button">💾 Simpan Data Sekolah</button></div><p id="saved"></p></section></main><script src="js/common.js"></script><script>const KEY='profil_sekolah_sias_v1',d={schoolName:'SMK NEGERI 1 MALUKU TENGAH',department:'DINAS PENDIDIKAN DAN KEBUDAYAAN',address:''};const p={...d,...JSON.parse(localStorage.getItem(KEY)||'{}')};document.getElementById('schoolName').value=p.schoolName;document.getElementById('department').value=p.department;document.getElementById('address').value=p.address||'';document.getElementById('save').onclick=()=>{const x={...JSON.parse(localStorage.getItem(KEY)||'{}'),schoolName:document.getElementById('schoolName').value.trim(),department:document.getElementById('department').value.trim(),address:document.getElementById('address').value.trim()};localStorage.setItem(KEY,JSON.stringify(x));document.getElementById('saved').textContent='✅ Data sekolah tersimpan.'}</script></body></html>
