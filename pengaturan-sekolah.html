<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pengaturan Sekolah — SIAS</title><link rel="stylesheet" href="css/style.css"></head><body><nav class="navbar"><div class="brand">📚 SIAS</div><button id="menuBtn" class="menu-btn">☰</button><div id="navlinks" class="navlinks"><a class="nav-item" href="dashboard-guru.html">🏠 Dashboard</a><a class="nav-item" href="rekap-harian.html">📅 Rekap Harian</a><a class="nav-item" href="rekap-bulanan.html">🗓️ Rekap Bulanan</a><a class="nav-item active" href="pengaturan-sekolah.html">🏫 Data Sekolah</a><a class="nav-item" href="pengaturan-guru.html">👨‍🏫 Data Guru</a></div><div class="user-area"><span>👨‍🏫 Guru</span><button id="logoutBtn" class="logout">Keluar</button></div></nav><main class="app"><div class="page-title"><div><h1>🏫 Data Sekolah</h1><p>Data ini digunakan pada kop laporan.</p></div></div><section class="card"><div class="filter-grid"><label>Nama Sekolah<input id="schoolName"></label><label>Instansi<input id="department"></label></div><button id="save" type="button" style="margin-top:18px">💾 Simpan Data Sekolah</button><p id="saved"></p></section></main><script src="js/common.js"></script><script>const KEY='profil_sekolah_sias_v1',d={schoolName:'SMK NEGERI 1 MALUKU TENGAH',department:'DINAS PENDIDIKAN DAN KEBUDAYAAN'};const p={...d,...JSON.parse(localStorage.getItem(KEY)||'{}')};schoolName.value=p.schoolName;department.value=p.department;save.onclick=()=>{const x={...JSON.parse(localStorage.getItem(KEY)||'{}'),schoolName:schoolName.value.trim(),department:department.value.trim()};localStorage.setItem(KEY,JSON.stringify(x));saved.textContent='✅ Data sekolah tersimpan.'}</script></body></html>
